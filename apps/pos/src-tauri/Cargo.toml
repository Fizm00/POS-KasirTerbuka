[package]
name = "kasir-terbuka"
version = "1.1.0"
description = "Kasir Terbuka - Local-First POS"
authors = ["Kasir Terbuka Contributors"]
license = "AGPL-3.0"
edition = "2021"

[lib]
name = "kasir_terbuka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4"
